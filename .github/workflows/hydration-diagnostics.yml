name: Hydration diagnostics

on:
  push:
    branches:
      - agent/e2e-hydration-diagnostics
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estatepro-hydration-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estatepro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estatepro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/estatepro
      NEXTAUTH_SECRET: estatepro-hydration-diagnostics-2026
      ADMIN_AUTH_SECRET: estatepro-hydration-admin-2026
      CRON_SECRET: estatepro-hydration-cron-2026
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_PASSWORD: DemoPass!2026
      HYDRATION_ARTIFACT_DIR: artifacts/hydration
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare disposable database
        run: |
          bun run db:generate
          bun run db:deploy
          SEED_DATABASE=estatepro-demo bun run db:seed

      - name: Install Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run development hydration diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/hydration
          bunx next dev --hostname 127.0.0.1 --port 3000 \
            > artifacts/hydration/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:3000/api/properties?limit=1" \
              > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next.js development server exited before becoming ready."
              cat artifacts/hydration/server.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Next.js development server did not become ready."
            cat artifacts/hydration/server.log
            exit 1
          fi

          python scripts/diagnose-hydration.py \
            2>&1 | tee artifacts/hydration/diagnostic.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estatepro-hydration-diagnostics-${{ github.run_attempt }}
          path: artifacts/hydration
          if-no-files-found: warn
          retention-days: 7
