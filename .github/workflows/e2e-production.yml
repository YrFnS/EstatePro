name: Production E2E

on:
  workflow_dispatch:
  push:
    branches:
      - agent/e2e-production-hardening
    paths:
      - "tests/e2e/**"
      - "playwright.config.cjs"
      - ".github/workflows/e2e-production.yml"
      - "vercel.json"
  pull_request:
    branches:
      - main
    paths:
      - "tests/e2e/**"
      - "playwright.config.cjs"
      - ".github/workflows/e2e-production.yml"
      - "vercel.json"

permissions:
  contents: read

concurrency:
  group: estatepro-production-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://estate-pro-one.vercel.app
      E2E_DEMO_PASSWORD: DemoPass!2026
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production E2E suite
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estatepro-production-e2e-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
