name: EstatePro E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estatepro-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estatepro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estatepro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/estatepro
      NEXTAUTH_SECRET: estatepro-e2e-nextauth-secret-2026
      ADMIN_AUTH_SECRET: estatepro-e2e-admin-secret-2026
      CRON_SECRET: estatepro-e2e-cron-secret-2026
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      HOSTNAME: 127.0.0.1
      PORT: "3000"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_PASSWORD: DemoPass!2026
      E2E_ARTIFACT_DIR: artifacts/e2e-playwright
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Prepare disposable database
        run: |
          bun run db:generate
          bun run db:deploy
          SEED_DATABASE=estatepro-demo bun run db:seed
          bun scripts/prepare-e2e-workers.ts

      - name: Install Chromium test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Build application
        run: bun run build

      - name: Run multi-role browser acceptance suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e-playwright/source
          cp src/components/real-estate/dashboard-page.tsx \
            artifacts/e2e-playwright/source/dashboard-page.tsx
          bun run start > artifacts/e2e-playwright/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:3000/api/properties?limit=1" \
              > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "EstatePro server exited before becoming ready."
              cat artifacts/e2e-playwright/server.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "EstatePro server did not become ready."
            cat artifacts/e2e-playwright/server.log
            exit 1
          fi

          python scripts/e2e_estatepro_runner.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estatepro-e2e-${{ github.run_attempt }}
          path: artifacts/e2e-playwright
          if-no-files-found: warn
          retention-days: 14
