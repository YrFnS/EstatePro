name: Publish scheduled listings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of due listings to publish
        required: false
        default: "250"

permissions:
  contents: read

concurrency:
  group: estatepro-listing-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: scheduled-listing-worker
      LISTING_PUBLISH_LIMIT: ${{ inputs.limit || '250' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check scheduler configuration
        id: configuration
        shell: bash
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL is not configured; scheduled listing publication was skipped."
          fi

      - name: Set up Bun
        if: steps.configuration.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        if: steps.configuration.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.configuration.outputs.configured == 'true'
        run: bun run db:generate

      - name: Publish due listings
        if: steps.configuration.outputs.configured == 'true'
        run: bun run listings:publish
